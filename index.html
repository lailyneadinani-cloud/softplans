<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Soft Plans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: bordeaux sidebar on desktop, bottom tab bar on phones; bordeaux marks "mine", orange marks "ours"; cards with a hard offset shadow. */
:root{
  --bg:#FDF8F2; --surface:#FFFCF8; --surface-2:#F8E6DA; --line:#EBC9B6; --line-2:#D98A6C;
  --ink:#4A121A; --ink-2:#6B3A3F; --ink-3:#8A5F5F;
  --sage:#B84A39; --sage-soft:#F3D9D0; --accent:#4A121A; --on-accent:#FDF8F2; --accent-ink:#4A121A;
  --hazel:#D98A6C; --hazel-soft:#F8E1D5; --hazel-ink:#8F3F26; --on-hazel:#4A121A;
  --alert:#A32A1B; --alert-soft:#F6D5CF; --scrim:rgba(74,18,26,.55);
  --side-bg:#4A121A; --side-ink:#FDF8F2; --side-2:#651B26; --card-sh:#EBC9B6;
  --blue:#B84A39;--on-blue:#fff; --blue-soft:#F3D9D0; --blue-ink:#8F3323;
  --yellow:#FDF8F2; --yellow-soft:#F8E6DA; --yellow-ink:#8F3F26;
  --hero:#D98A6C; --hero-ink:#4A121A; --hero-em:#7A1F14; --hero-sh:#4A121A;
  --font-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E0C12; --surface:#2A131B; --surface-2:#37191F; --line:#4A2630; --line-2:#6B3A46;
    --ink:#FFF0DF; --ink-2:#E3C6B8; --ink-3:#BF9C94;
    --sage:#E4806B; --sage-soft:#4A1A18; --accent:#F0A98F; --on-accent:#2A0F17; --accent-ink:#F4B9A3;
    --hazel:#E08F72; --hazel-soft:#4A2812; --hazel-ink:#F0B49C; --on-hazel:#2A0F17;
    --alert:#FF8F7F; --alert-soft:#4A211E; --scrim:rgba(0,0,0,.65);
    --side-bg:#14070C; --side-ink:#FFE3D2; --side-2:#2A131B; --card-sh:#000000;
    --blue:#E4806B;--on-blue:#2A0705; --blue-soft:#4A1A18; --blue-ink:#F0A18F;
    --yellow:#FDF8F2; --yellow-soft:#4A2630; --yellow-ink:#F0A98F; --hero-sh:#B84A39;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E0C12; --surface:#2A131B; --surface-2:#37191F; --line:#4A2630; --line-2:#6B3A46;
    --ink:#FFF0DF; --ink-2:#E3C6B8; --ink-3:#BF9C94;
    --sage:#E4806B; --sage-soft:#4A1A18; --accent:#F0A98F; --on-accent:#2A0F17; --accent-ink:#F4B9A3;
    --hazel:#E08F72; --hazel-soft:#4A2812; --hazel-ink:#F0B49C; --on-hazel:#2A0F17;
    --alert:#FF8F7F; --alert-soft:#4A211E; --scrim:rgba(0,0,0,.65);
    --side-bg:#14070C; --side-ink:#FFE3D2; --side-2:#2A131B; --card-sh:#000000;
    --blue:#E4806B;--on-blue:#2A0705; --blue-soft:#4A1A18; --blue-ink:#F0A18F;
    --yellow:#FDF8F2; --yellow-soft:#4A2630; --yellow-ink:#F0A98F; --hero-sh:#B84A39;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:26px 16px 20px;display:flex;flex-direction:column;gap:28px;background:var(--side-bg);color:var(--side-ink)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1;padding-inline:8px;color:var(--side-ink);border:0;background:none;cursor:pointer;text-align:left;width:100%}
.brand:hover .logo{transform:rotate(-4deg) scale(1.04)}.brand .logo{transition:transform .2s;width:3.6rem;height:3.6rem;flex:none;margin-left:-.2rem;background:none;color:var(--side-ink);fill:currentColor}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;text-align:left;color:var(--side-ink);font-weight:500;opacity:.88}
.nav-i:hover{background:var(--side-2);opacity:1}
.nav-i.on{background:var(--yellow);color:#4A121A;font-weight:700;opacity:1}
.l-short{display:none}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--side-2);min-width:0}
.me-chip b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip span{font-size:.78rem;opacity:.8}
.me-chip .av{border-color:var(--hazel)}
.main{padding:34px clamp(16px,4vw,44px) 64px;min-width:0;max-width:1180px;width:100%}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--surface);flex:none;display:inline-block}
.av.sm{width:22px;height:22px;border-width:1.5px}
.av.big{width:54px;height:54px}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-7px}

/* type + headings */
.h1{font-family:var(--font-display);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;font-weight:800;letter-spacing:-.03em;text-wrap:balance;color:var(--accent-ink)}
.h1 em{font-style:normal;color:var(--alert)}
.sub{color:var(--ink-2);margin-top:8px}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hazel-ink);font-weight:700}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:16px 20px;margin-bottom:24px;position:relative}
.page-head .head-actions{margin-left:auto}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.deco{position:absolute;right:-6px;top:-26px;width:110px;height:110px;color:var(--hazel);opacity:.55;pointer-events:none;stroke-width:1.1}
.sec-h{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin:24px 0 2px;display:flex;justify-content:space-between;gap:8px}
.sec-h.today{color:var(--hazel-ink)}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:12px;font-weight:600;font-size:.9rem;line-height:1.2;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{background:#8F3323;border-color:#8F3323;color:#fff}
.btn.warm{background:var(--hazel);border-color:var(--hazel);color:var(--on-hazel)}
.btn.warm:hover{filter:brightness(1.07);background:var(--hazel)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem}
.btn.armed{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:9px;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.armed{background:var(--alert-soft);color:var(--alert);width:auto;padding-inline:10px;gap:6px;display:inline-flex;align-items:center;font-size:.8rem;font-weight:600}
.link{border:0;background:none;color:var(--blue-ink);font-weight:600;font-size:.84rem;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--surface-2);border-radius:14px;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--accent);color:var(--on-accent)}
.bar-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:6px}

/* cards + lists */
.card{background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r);padding:18px 18px 12px;min-width:0;box-shadow:4px 4px 0 var(--card-sh)}
.card.pad{padding-bottom:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-h h2{font-family:var(--font-display);font-size:1.12rem;font-weight:800;letter-spacing:-.01em;color:var(--accent-ink)}
.dash{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s12{grid-column:span 12}
@media(max-width:980px){.s7,.s6,.s5{grid-column:span 12}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child,.card-h+.row,.sec-h+.row{border-top:0}
.check{width:24px;height:24px;border-radius:50%;border:1.7px solid var(--sage);background:transparent;color:transparent;display:grid;place-items:center;flex:none;margin-top:1px;padding:0}
.check.c,.is-c .check{border-color:var(--hazel)}
.check:hover{background:var(--sage-soft)}
.check.c:hover,.is-c .check:hover{background:var(--hazel-soft)}
.check[aria-pressed=true]{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.check.c[aria-pressed=true],.is-c .check[aria-pressed=true]{background:var(--hazel);border-color:var(--hazel)}
.check .ic{width:14px;height:14px;stroke-width:2.6}
.check.sm{width:20px;height:20px}
.row-body{flex:1 1 200px;min-width:0;cursor:pointer}
.row-title{font-weight:500;overflow-wrap:anywhere}
.done .row-title{text-decoration:line-through;color:var(--ink-3)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.row-act{display:flex;align-items:center;gap:2px;margin-left:auto}
@media (hover:hover){.row.hov .row-act{opacity:0}.row.hov:hover .row-act,.row.hov:focus-within .row-act{opacity:1}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;color:var(--ink-2);background:var(--surface-2);padding:1px 8px;border-radius:999px;line-height:1.6}
.chip .ic{width:.95em;height:.95em}
.chip.late,.pill.hi{background:var(--alert-soft);color:var(--alert)}
.chip.c,.pill.c{background:var(--hazel-soft);color:var(--hazel-ink)}
.chip.ok{background:var(--blue-soft);color:var(--blue-ink)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;min-width:0}
.bar.c i{background:var(--hazel)}
.pct{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem}
.prow{padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child,.card-h+.prow{border-top:0}
.prow-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.prow-h span:first-child{font-weight:500;overflow-wrap:anywhere}
.rank{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--on-blue);font-weight:800;font-size:.78rem;display:grid;place-items:center;flex:none;margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 16px;color:var(--ink-2)}
.empty .ic{width:56px;height:56px;color:var(--hazel);stroke-width:1.1}
.empty h3{font-family:var(--font-display);font-size:1.6rem;color:var(--accent-ink);font-weight:800;letter-spacing:-.02em}
.empty.mini{padding:16px 8px;gap:4px}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--hazel-soft);color:var(--hazel-ink);font-weight:500;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner.err{background:var(--alert-soft);color:var(--alert)}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:.88rem;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.note .ic{margin-top:2px;color:var(--accent-ink)}

/* weekly chart */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.wd{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.wd b{font-variant-numeric:tabular-nums;font-size:.85rem}
.wd i{display:block;width:100%;max-width:38px;background:var(--sage);border-radius:8px 8px 3px 3px;min-height:4px;opacity:.5}
.wd.t i{opacity:1;background:var(--hazel)}
.wd span{font-size:.74rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.mood{columns:210px;column-gap:14px}
.mood-t{display:block;width:100%;padding:0;margin:0 0 14px;break-inside:avoid;position:relative;border-radius:14px;overflow:hidden;border:1.5px solid var(--line-2);box-shadow:3px 3px 0 var(--card-sh);background:var(--surface-2);cursor:zoom-in}
.mood-t img{display:block;width:100%;height:auto}
.mood-t span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(43,13,20,.8));color:#FFF3E6;font-size:.82rem;text-align:left;overflow-wrap:anywhere}
.dropzone{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px 16px;text-align:center;margin:14px 0 18px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.dropzone.over{border-color:var(--hazel);background:var(--hazel-soft)}
.dropzone .ic.big{width:40px;height:40px;color:var(--hazel);stroke-width:1.3}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.mood-big{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface-2);margin-bottom:14px}
/* illustrations */
.pic{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--surface);box-shadow:5px 5px 0 var(--hazel);overflow:hidden;background:var(--surface-2);display:inline-block}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pics{display:inline-flex;align-items:center;flex:none}
.pics .pic{width:84px;height:84px}
.pics .pic+.pic{margin-left:-26px;box-shadow:5px 5px 0 var(--blue)}
.gate .pics{justify-content:center}
.empty-face{width:84px;height:84px;border-radius:50%;border:3px solid var(--surface);box-shadow:4px 4px 0 var(--hazel);object-fit:cover}
.empty.mini .empty-face{width:52px;height:52px;box-shadow:3px 3px 0 var(--hazel)}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px}
.face-b{padding:0;border:3px solid transparent;border-radius:50%;background:none;aspect-ratio:1;display:block}
.face-b img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.face-b:hover{border-color:var(--line-2)}
.face-b[aria-pressed=true]{border-color:var(--hazel);box-shadow:3px 3px 0 var(--blue)}
.hero{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:28px clamp(20px,4vw,40px);margin-bottom:24px;overflow:hidden;box-shadow:6px 6px 0 var(--hero-sh)}
.hero-t{min-width:0;flex:1 1 320px}
.hero .eyebrow{color:var(--hero-ink);opacity:.8}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.03em;margin:6px 0 10px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--hero-em)}
.hero p{margin:0}
.hero .head-actions{margin:18px 0 0}
.hero .btn{border-color:transparent}
.hero .btn.primary{background:#B84A39;border-color:#B84A39;color:#fff}
.hero .btn.warm{background:transparent;border:2px solid var(--hero-ink);color:var(--hero-ink)}
.hero .btn.warm:hover{background:rgba(79,19,34,.1)}

.logo-gate{display:block;width:clamp(150px,34vw,210px);height:auto;margin:0 auto 14px;color:var(--accent);fill:currentColor}

.hero-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-sub .av{border-color:var(--hero);width:34px;height:34px}
.hero-sub .avs .av+.av{margin-left:-10px}
.hero-sub .ph{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px dashed var(--hero-ink);margin-left:-10px;font-weight:800;line-height:1}
@media(max-width:700px){.hero{padding-bottom:30px}.hero .head-actions{max-width:56%}}
@media(max-width:560px){.pic{width:64px;height:64px;box-shadow:4px 4px 0 var(--hazel)}.pics .pic{width:58px;height:58px}.pics .pic+.pic{margin-left:-18px}}
.kpis .kpi:nth-child(4n+2) b{color:var(--hazel-ink)}
.kpis .kpi:nth-child(4n+3) b{color:var(--alert)}
.kpis .kpi:nth-child(4n+4) b{color:var(--yellow-ink)}
.kcol[data-drop=todo]{border-top:6px solid var(--alert)}
.kcol[data-drop=doing]{border-top:6px solid var(--hazel)}
.kcol[data-drop=done]{border-top:6px solid var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi b{display:block;font-family:var(--font-display);font-size:2.8rem;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--blue-ink)}
.kpi span{font-size:.82rem;color:var(--ink-2)}

/* goals, projects */
.gcard h3,.pcard h3{font-family:var(--font-display);font-size:1.2rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.gcard,.pcard{display:flex;flex-direction:column;gap:10px}
.pcard{cursor:pointer;text-align:left;width:100%}
.pcard:hover{border-color:var(--line-2)}
.meta-line{display:flex;flex-wrap:wrap;gap:6px}
.sub-lines{display:flex;flex-direction:column;gap:2px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:820px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:12px;min-height:130px}
.kcol-h{font-family:var(--font-display);color:var(--accent-ink)}
.kcol.over{outline:2px dashed var(--sage);outline-offset:-4px}
.kcol-h{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem;margin-bottom:4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.kcard[draggable=true]{cursor:grab}
.kmove{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:8px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h .h2{margin-right:auto;min-width:9ch}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-dow{background:var(--surface-2);text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:7px 0}
.cal-cell{background:var(--surface);border:0;border-radius:0;min-height:92px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:0}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--bg);color:var(--ink-3)}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal-n{font-weight:600;font-size:.85rem;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-cell.today .cal-n{background:var(--accent);color:var(--on-accent)}
.cal-t{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;color:var(--ink-2)}
.cal-t.d{text-decoration:line-through;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block;flex:none}
.dot.c{background:var(--hazel)}
.dot.e{background:transparent;border:1.6px solid var(--hazel)}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
@media(max-width:700px){.cal-cell{min-height:54px;padding:4px;align-items:center}.cal-t{display:none}.dots{display:flex}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* forms + modal */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin-bottom:14px}
.chk input{margin-top:3px;accent-color:var(--blue)}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer}
.radios input{accent-color:var(--blue)}
.radios label:has(input:checked){background:var(--sage-soft);border-color:var(--sage)}
.radios label.dis{opacity:.5;cursor:default}
.qd{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.actions .sp{margin-right:auto}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:auto;background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--hazel)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{font-family:var(--font-display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--accent-ink)}
.subrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.subrow input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;flex:none}
.live{border-top:1px solid var(--line);margin-top:18px;padding-top:6px}
.live h3{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.srow{display:flex;gap:10px;align-items:center;padding:5px 0}
.srow span{flex:1;min-width:0;overflow-wrap:anywhere}
.srow.d span{text-decoration:line-through;color:var(--ink-3)}
.cm{display:flex;gap:10px;padding:8px 0}
.cm p{overflow-wrap:anywhere;white-space:pre-wrap}
.cm small{color:var(--ink-3)}
.inline-add{display:flex;gap:8px;margin-top:6px}
@media(max-width:600px){
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.toast{background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:12px;font-weight:500;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--alert);color:#fff}
.gate{max-width:480px;margin:12vh auto;padding-inline:20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate .ic.big{width:72px;height:72px;color:var(--hazel);stroke-width:1.05}
.gate h1{font-family:var(--font-display);font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--accent-ink)}
.gate h1 em{white-space:nowrap;font-style:normal;color:var(--hazel)}
.gate p{color:var(--ink-2)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

/* ───────── motion ───────── */
/* hover motion: always on (user-triggered) */
  @keyframes wave{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.22em) rotate(-6deg)}60%{transform:translateY(.05em) rotate(3deg)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .btn,.card,.nav-i,.tab,.face-b,.av,.pic,.check,.chip{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .18s,border-color .18s,color .18s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(74,18,26,.18)}
  .btn:active{transform:translateY(1px) scale(.97);box-shadow:none}
  .btn svg,.nav-i svg,.tab svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .btn:hover svg{transform:rotate(-10deg) scale(1.2)}
  .nav-i:hover{transform:translateX(5px)}.nav-i:hover svg{transform:scale(1.25) rotate(-8deg)}
  .tab:hover svg{transform:scale(1.2)}
  .card:hover{transform:translateY(-3px);box-shadow:7px 7px 0 var(--card-sh)}
  .av:hover,.pic:hover{transform:scale(1.18) rotate(-5deg);position:relative;z-index:2}
  .face-b:hover{transform:scale(1.1) rotate(-3deg)}.face-b[aria-pressed=true]{animation:pop .4s}
  .check:hover{transform:scale(1.15)}
  .brand .l,.brand{transition:letter-spacing .25s}.brand:hover{letter-spacing:.01em}
  .hero h1 em{display:inline-block}.hero h1 em .l{display:inline-block;white-space:pre}
  .hero h1 em:hover .l{animation:wave .7s ease both;animation-delay:calc(var(--i)*55ms)}
  .hero .head-actions .btn:hover{transform:translateY(-3px) rotate(-1deg)}
  .gate .logo-gate:hover{animation-duration:1.4s}
@media(prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
  .enter .main>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
  .enter .main>*:nth-child(2){animation-delay:.06s}.enter .main>*:nth-child(3){animation-delay:.12s}.enter .main>*:nth-child(n+4){animation-delay:.18s}
  .enter .grid>*,.enter .cards>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
  .enter .grid>*:nth-child(2),.enter .cards>*:nth-child(2){animation-delay:.1s}.enter .grid>*:nth-child(3),.enter .cards>*:nth-child(3){animation-delay:.16s}.enter .grid>*:nth-child(n+4),.enter .cards>*:nth-child(n+4){animation-delay:.22s}
  .gate .logo-gate{animation:floaty 5s ease-in-out infinite}
  .toast{animation:rise .3s backwards}
}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}

/* phone */
@media(max-width:860px){
  .app{display:block}
  .side{position:static;height:auto;border:0;padding:14px 16px;flex-direction:row;align-items:center;gap:12px;border-radius:0 0 22px 22px}
  .me-chip{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;justify-content:space-around;gap:0;background:var(--side-bg);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav-i{flex-direction:column;gap:2px;padding:6px 2px;flex:1;min-width:0;font-size:11px;align-items:center;text-align:center;border-radius:8px}
  .l-long{display:none}.l-short{display:inline}
  .main{padding-top:20px;padding-bottom:104px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .deco{width:80px;height:80px;top:-14px}
}

function prep(){
  X.today=todayStr();
  X.st={};S.stasks.forEach(t=>X.st[t.id]=t);
  X.proj={};S.projects.forEach(p=>X.proj[p.id]=p);
  X.plan={};S.plan.forEach(p=>X.plan[p.id]=p);
  X.cc={};S.comments.forEach(c=>X.cc[c.taskId]=(X.cc[c.taskId]||0)+1);
}

/* ───────── feedback ───────── */
function toast(msg,kind){
  const el=document.createElement("div");el.className="toast "+(kind==="err"?"err":"");el.textContent=msg;toasts.appendChild(el);
  setTimeout(()=>el.remove(),kind==="err"?6000:2800);
}
function errMsg(e){
  switch(e&&e.code){
    case "quota_exceeded":return "L’espace de stockage est plein. Supprime quelques éléments puis réessaie.";
    case "permission-denied":case "invalid_argument":return "Cette adresse Google n’est pas autorisée sur cet espace (voir firestore.rules).";
    case "resource-exhausted":return "Trop d’actions d’un coup. Attends quelques secondes et réessaie.";
    case "resource_exhausted":return "Trop d’actions d’un coup. Attends quelques secondes et réessaie.";
    case "revoked":return "Ton accès a été retiré. Recharge la page.";
    default:return "L’enregistrement a échoué. Vérifie ta connexion et réessaie.";
  }
}
async function run(label,fn){
  try{await fn()}catch(e){
    if(e&&e.code==="unavailable"){await sleep(300+Math.random()*500);try{await fn()}catch(e2){toast(errMsg(e2),"err");return false}}
    else{toast(errMsg(e),"err");return false}
  }
  if(label)toast(label);
  return true;
}
function armLocal(el,label){
  if(el.dataset.armed){return true}
  el.dataset.armed="1";const html=el.innerHTML;el.classList.add("armed");el.innerHTML=ic("trash")+"<span>"+(label||"Confirmer")+"</span>";
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.classList.remove("armed");el.innerHTML=html}},3200);
  return false;
}

function myItems(){
  const out=[];
  S.tasks.forEach(t=>out.push({k:"p",id:t.id,title:t.title,done:t.status==="done",date:t.due||"",pr:t.priority||"moyenne",cat:t.category||"",subs:t.subtasks||[],shared:!!t.shared}));
  S.plan.forEach(p=>{
    const st=X.st[p.id];if(!st||st.parentId)return;
    const proj=X.proj[st.projectId];
    out.push({k:"c",id:st.id,title:st.title,done:st.status==="done",date:p.date,due:st.due||"",pr:st.priority||"moyenne",cat:proj?proj.title:"",subs:S.stasks.filter(s=>s.parentId===st.id).map(s=>({done:s.status==="done"}))});
  });
  return out;
}
const cmpItems=(a,b)=>(PR[a.pr]!=null?PR[a.pr]:1)-(PR[b.pr]!=null?PR[b.pr]:1)||String(a.title).localeCompare(b.title,"fr");
const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||String(a.title).localeCompare(b.title,"fr");
function goalProg(g){const ts=S.tasks.filter(t=>t.goalId===g.id);const n=ts.length,d=ts.filter(t=>t.status==="done").length;return{n:n,d:d,pct:g.status==="atteint"?100:(n?Math.round(d/n*100):0)}}
function projStat(pid){const ts=S.stasks.filter(t=>t.projectId===pid&&!t.parentId);const d=ts.filter(t=>t.status==="done").length,g=ts.filter(t=>t.status==="doing").length;return{n:ts.length,d:d,doing:g,todo:ts.length-d-g,pct:ts.length?Math.round(d/ts.length*100):0}}
function myDoneDates(){
  const ev=[];
  S.tasks.forEach(t=>{if(t.status==="done"&&t.doneAt)ev.push(ymd(new Date(t.doneAt)))});
  S.stasks.forEach(t=>{if(!t.parentId&&t.status==="done"&&t.doneAt&&t.doneBy===S.uid)ev.push(ymd(new Date(t.doneAt)))});
  return ev;
}
function myStats(){
  const ev=myDoneDates(),t=todayStr(),wk=startOfWeek(t),lw=addDays(wk,-7);
  const perDay=[0,1,2,3,4,5,6].map(i=>ev.filter(e=>e===addDays(wk,i)).length);
  const week=perDay.reduce((a,b)=>a+b,0);
  const last=ev.filter(e=>e>=lw&&e<wk).length;
  const month=ev.filter(e=>e.slice(0,7)===t.slice(0,7)).length;
  return{perDay:perDay,week:week,last:last,month:month,total:ev.length};
}

/* ───────── render ───────── */
let raf=0;
function scheduleRender(){
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;const a=document.activeElement;if(a&&a.tagName==="SELECT"&&app.contains(a)){setTimeout(scheduleRender,600);return}render()});
}
function render(){
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.id&&app.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const y=window.scrollY;
  if(S.gate)app.innerHTML=gateHTML(S.gate);
  else if(!S.booted)app.innerHTML=loadingHTML();
  else if(!isMember())app.innerHTML=joinHTML();
  else{
    prep();
    let c="";
    try{c=({accueil:pageAccueil,moi:pageMoi,amie:pageAmie,duo:pageDuo,cal:pageCal,reglages:pageReglages}[S.page]||pageAccueil)()}catch(e){console.error(e);c='<div class="banner err"><div>Cette page n’a pas pu s’afficher. Recharge la page.</div></div>'}
    app.innerHTML=shell(c);document.body.classList.toggle("enter",!!S.enter);S.enter=false;
  }
  window.scrollTo(0,y);
  if(S.ui.refocus){const el=document.getElementById(S.ui.refocus);if(el)el.focus();S.ui.refocus=null}
  else if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  refreshLive();
}

  const prios=open.slice().sort((a,b)=>((a.date&&a.date<today)?0:1)-((b.date&&b.date<today)?0:1)||cmpItems(a,b)||(a.date||"9999").localeCompare(b.date||"9999")).slice(0,3);

    "</header>";

  const cToday=card("Mes tâches du jour",
    (late.length?'<div class="sec-h" style="margin-top:4px;color:var(--alert)">En retard</div>'+late.slice(0,3).map(i=>rowP(i,{compact:true})).join(""):"")+

  const cGoals=card("Mes objectifs",

    '<button class="link" data-act="goMoi" data-tab="goals">Voir tout</button>',"s5");

function pageMoi(){

function shiftAnchor(mode,a,d){
  if(d===0)return todayStr();
  if(mode==="jour")return addDays(a,d);
  if(mode==="semaine")return addDays(a,7*d);
  const x=parse(a);return ymd(new Date(x.getFullYear(),x.getMonth()+d,1));
}
function viewTodo(){
  const u=S.ui.todo,today=X.today,items=myItems();
  let from,to,label;
  if(u.mode==="jour"){from=to=u.anchor;label=cap(fmt(u.anchor,{weekday:"long",day:"numeric",month:"long"}))}
  else if(u.mode==="semaine"){from=startOfWeek(u.anchor);to=addDays(from,6);label="Du "+fmt(from,{day:"numeric",month:"long"})+" au "+fmt(to,{day:"numeric",month:"long"})}
  else{const d=parse(u.anchor);from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));label=cap(fmt(u.anchor,{month:"long",year:"numeric"}))}
  const hasToday=from<=today&&today<=to;
  const lateItems=hasToday?items.filter(i=>!i.done&&i.date&&i.date<today).sort((a,b)=>a.date.localeCompare(b.date)||cmpItems(a,b)):[];
  const lateSet=new Set(lateItems.map(i=>i.k+i.id));
  const inRange=items.filter(i=>i.date&&i.date>=from&&i.date<=to&&!lateSet.has(i.k+i.id));
  let h='<div class="bar-tools" style="margin-top:14px"><div class="tabs">'+[["jour","Jour"],["semaine","Semaine"],["mois","Mois"]].map(m=>'<button class="tab '+(u.mode===m[0]?"on":"")+'" data-act="todoMode" data-mode="'+m[0]+'">'+m[1]+"</button>").join("")+"</div>"+
    '<div class="cal-h" style="margin:0"><button class="icon-btn" data-act="todoNav" data-d="-1" aria-label="Précédent">'+ic("chev-l")+'</button><strong style="min-width:12ch;text-align:center">'+esc(label)+'</strong><button class="icon-btn" data-act="todoNav" data-d="1" aria-label="Suivant">'+ic("chev-r")+'</button><button class="btn sm" data-act="todoNav" data-d="0">Aujourd’hui</button></div>'+
    '<button class="btn sm warm" data-act="planPick" style="margin-left:auto">'+ic("calplus")+"Ajouter une tâche commune</button></div>";
  h+='<form data-form="quick" class="inline-add" style="margin:10px 0 0"><label class="sr-only" for="quick-t">Nouvelle tâche</label><input type="text" id="quick-t" placeholder="Ajouter une tâche pour '+(u.mode==="jour"?esc(dayWord(u.anchor).toLowerCase()):"cette période")+' et appuyer sur Entrée" maxlength="160" autocomplete="off"><button class="btn primary" type="submit" aria-label="Ajouter">'+ic("plus")+"</button></form>";
  if(lateItems.length)h+='<div class="sec-h" style="color:var(--alert)"><span>En retard</span><span>'+lateItems.length+"</span></div><div class=\"card pad\" style=\"padding-block:4px\">"+lateItems.map(i=>rowP(i)).join("")+"</div>";
  if(u.mode==="jour"){

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};i.src=u})}
async function compress(file){
  const img=await loadImg(file);let max=1000,q=.8;
  for(let n=0;n<8;n++){
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const out=c.toDataURL("image/jpeg",q);
    if(out.length<190000)return{img:out,w:w,h:h};
    q=Math.max(.5,q-.1);max=Math.round(max*.85);
  }
  throw new Error("big");
}
async function addMood(files){
  if(S.ui.moodBusy)return;
  const room=MOOD_MAX-S.mood.length;
  if(room<=0){toast("Ton mood board est plein ("+MOOD_MAX+" images). Supprime-en pour en ajouter.","err");return}
  const list=Array.from(files||[]).filter(f=>/^image\//.test(f.type)).slice(0,Math.min(room,12));
  if(!list.length){toast("Choisis des fichiers image (JPG, PNG ou WebP).","err");return}
  S.ui.moodBusy=true;render();
  let ok=0,bad=0;
  for(const f of list){
    try{const r=await compress(f);const good=await run("",()=>C.mood.doc().set({img:r.img,w:r.w,h:r.h,caption:"",createdAt:Date.now()}));if(good)ok++;else bad++}
    catch(e){bad++}
  }
  S.ui.moodBusy=false;render();
  if(ok)toast(ok+(ok>1?" images ajoutées":" image ajoutée"));
  if(bad&&!ok)toast("Ces images n’ont pas pu être ajoutées. Essaie un fichier JPG ou PNG.","err");
}

function calEvents(o){
  const ev={},push=(d,e)=>{if(d)(ev[d]||(ev[d]=[])).push(e)};
  if(o.pid){
    S.stasks.filter(t=>!t.parentId&&t.projectId===o.pid&&whoMatch(t,o.who||"all")).forEach(t=>push(t.due,{type:"e",id:t.id,title:t.title,done:t.status==="done"}));
    return ev;
  }
  if(o.perso)S.tasks.forEach(t=>push(t.due,{type:"p",id:t.id,title:t.title,done:t.status==="done"}));
  if(o.commun){
    S.plan.forEach(p=>{const st=X.st[p.id];if(st&&!st.parentId)push(p.date,{type:"c",id:st.id,title:st.title,done:st.status==="done"})});
    S.stasks.filter(t=>!t.parentId).forEach(t=>push(t.due,{type:"e",id:t.id,title:t.title,done:t.status==="done"}));
  }
  return ev;
}
function calendarBlock(key,ev,o){
  const t=parse(X.today);
  const st=S.ui.cal[key]||(S.ui.cal[key]={y:t.getFullYear(),m:t.getMonth(),sel:X.today});
  const first=new Date(st.y,st.m,1),lead=(first.getDay()+6)%7,days=new Date(st.y,st.m+1,0).getDate(),cells=(lead+days)>35?42:35;
  let g='<div class="cal" role="grid" aria-label="'+esc(cap(fmt(ymd(first),{month:"long",year:"numeric"})))+'">'+DAYS.map(d=>'<div class="cal-dow" role="columnheader">'+d+"</div>").join("");
  for(let i=0;i<cells;i++){
    const d=new Date(st.y,st.m,1-lead+i),ds=ymd(d),es=ev[ds]||[];
    g+='<button class="cal-cell '+(d.getMonth()!==st.m?"out ":"")+(ds===X.today?"today ":"")+(ds===st.sel?"sel":"")+'" data-act="calSel" data-key="'+key+'" data-date="'+ds+'" aria-label="'+esc(fmt(ds,{weekday:"long",day:"numeric",month:"long"}))+(es.length?", "+es.length+" élément"+(es.length>1?"s":""):"")+'"><span class="cal-n">'+d.getDate()+"</span>"+
      es.slice(0,2).map(e=>'<span class="cal-t '+(e.done?"d":"")+'"><i class="dot '+(e.type==="p"?"":e.type)+'"></i>'+esc(e.title)+"</span>").join("")+(es.length>2?'<span class="cal-t muted">+'+(es.length-2)+"</span>":"")+
      '<span class="dots">'+es.slice(0,4).map(e=>'<i class="dot '+(e.type==="p"?"":e.type)+'"></i>').join("")+"</span></button>";
  }
  g+="</div>";
  const sel=(ev[st.sel]||[]);
  const list=sel.length?sel.map(e=>{
    const k=e.type==="p"?"p":(e.type==="c"?"c":"s");
    return '<div class="row '+(e.type!=="p"?"is-c ":"")+(e.done?"done":"")+'"><button class="check '+(e.type!=="p"?"c":"")+'" data-act="toggle" data-k="'+k+'" data-id="'+e.id+'" aria-pressed="'+e.done+'" aria-label="Terminer : '+esc(e.title)+'">'+ic("check")+'</button><div class="row-body" role="button" tabindex="0" data-act="open" data-k="'+k+'" data-id="'+e.id+'"><div class="row-title">'+esc(e.title)+'</div><div class="row-meta">'+(e.type==="p"?'<span class="chip ok">Perso</span>':e.type==="c"?'<span class="chip pill c">'+ic("users")+"Dans ma journée</span>":'<span class="chip pill c">'+ic("users")+"Échéance commune</span>")+"</div></div></div>";
  }).join(""):'<p class="muted" style="padding:12px 0">Rien de prévu ce jour.</p>';
  return '<div class="cal-h"><h2 class="h2">'+esc(cap(fmt(ymd(first),{month:"long",year:"numeric"})))+'</h2><button class="icon-btn" data-act="calNav" data-key="'+key+'" data-d="-1" aria-label="Mois précédent">'+ic("chev-l")+'</button><button class="btn sm" data-act="calNav" data-key="'+key+'" data-d="0">Aujourd’hui</button><button class="icon-btn" data-act="calNav" data-key="'+key+'" data-d="1" aria-label="Mois suivant">'+ic("chev-r")+"</button></div>"+g+

    '<div class="sec-h"><span>'+esc(cap(fmt(st.sel,{weekday:"long",day:"numeric",month:"long"})))+'</span></div><div class="card" style="padding-block:4px">'+list+'</div><div class="head-actions" style="margin-top:12px">'+(o.perso?'<button class="btn" data-act="newP" data-date="'+st.sel+'">'+ic("plus")+"Tâche perso ce jour</button>":"")+(o.commun?'<button class="btn warm" data-act="newS" data-date="'+st.sel+'"'+(o.pid?' data-pid="'+o.pid+'"':"")+">"+ic("plus")+"Tâche commune ce jour</button>":"")+"</div>";

async function saveSTask(id,d){
  const old=id?X.st[id]:null;

  return run(id?"Tâche enregistrée":"Tâche ajoutée",()=>ref.set(rec)).then(ok=>ok?ref.id:null);

async function deleteSTask(id){
  const subs=S.stasks.filter(s=>s.parentId===id).map(s=>s.id);
  const cms=S.comments.filter(c=>c.taskId===id).map(c=>c.id);
  return run("Tâche supprimée",async()=>{
    for(const s of subs)await C.stasks.doc(s).delete();
    for(const c of cms)await C.comments.doc(c).delete();
    await C.stasks.doc(id).delete();
    if(X.plan[id])await C.plan.doc(id).delete();
  });
}
async function deleteProject(id){
  const ts=S.stasks.filter(t=>t.projectId===id);
  const cms=S.comments.filter(c=>ts.some(t=>t.id===c.taskId));

    for(const c of cms)await C.comments.doc(c.id).delete();
    for(const t of ts){await C.stasks.doc(t.id).delete();if(X.plan[t.id])await C.plan.doc(t.id).delete()}

/* ───────── reconcile: mirrors, stats, orphans ───────── */
let rcT=0,rcBusy=false,rcAgain=false;
function recon(){clearTimeout(rcT);rcT=setTimeout(doRecon,1000)}
async function doRecon(){
  if(rcBusy){rcAgain=true;return}
  rcBusy=true;
  try{do{rcAgain=false;await reconOnce()}while(rcAgain)}catch(e){console.warn(e)}
  rcBusy=false;
}
const mirT=t=>({ownerId:S.uid,kind:"task",title:t.title,due:t.due||"",done:t.status==="done",priority:t.priority||"moyenne",category:t.category||"",progress:0,status:t.status,horizon:""});
const mirG=g=>({ownerId:S.uid,kind:"goal",title:g.title,due:g.due||"",done:g.status==="atteint",priority:"",category:g.category||"",progress:goalProg(g).pct,status:g.status,horizon:g.horizon||"court"});
const same=(cur,w)=>Object.keys(w).every(k=>cur[k]===w[k]);
async function reconOnce(){
  if(!S.booted||!isMember())return;
  prep();
  const want=new Map();
  S.tasks.forEach(t=>{if(t.shared)want.set("task-"+t.id,mirT(t))});
  S.goals.forEach(g=>{if(g.shared)want.set("goal-"+g.id,mirG(g))});
  for(const m of S.mirrors.slice()){if(m.ownerId===S.uid&&!want.has(m.id))await C.mirrors.doc(m.id).delete()}
  for(const e of want){const cur=S.mirrors.find(m=>m.id===e[0]);if(!cur||!same(cur,e[1]))await C.mirrors.doc(e[0]).set(Object.assign({},e[1],{updatedAt:Date.now()}))}
  const av0=S.prefs.avatar!=null?S.prefs.avatar:-1;
  const s=myStats(),share=S.prefs.shareStats!==false,gs=S.goals.filter(g=>g.status==="en cours"),wk=startOfWeek(todayStr());
  const desired=share?{share:true,wk:wk,doneWeek:s.week,doneTotal:s.total,goalsActive:gs.length,goalsAvg:gs.length?Math.round(gs.reduce((a,g)=>a+goalProg(g).pct,0)/gs.length):0,avatar:av0,name:myName()}:{share:false,wk:"",doneWeek:0,doneTotal:0,goalsActive:0,goalsAvg:0,avatar:av0,name:myName()};
  const cur=S.pstats[S.uid];
  if(!cur||!same(cur,desired))await C.pstats.doc(S.uid).set(Object.assign({},desired,{updatedAt:Date.now()}));
  for(const p of S.plan.slice()){if(!X.st[p.id])await C.plan.doc(p.id).delete()}
}

/* kanban drag and drop */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-drag]");if(c){e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-moodzone]");if(z){e.preventDefault();z.classList.add("over");return}const col=e.target.closest&&e.target.closest("[data-drop]");if(col){e.preventDefault();col.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-moodzone]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over");const col=e.target.closest&&e.target.closest("[data-drop]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("over")});
document.addEventListener("drop",e=>{
  const z=e.target.closest&&e.target.closest("[data-moodzone]");
  if(z){e.preventDefault();z.classList.remove("over");addMood(e.dataTransfer.files);return}
  const col=e.target.closest&&e.target.closest("[data-drop]");if(!col)return;
  e.preventDefault();col.classList.remove("over");
  const id=e.dataTransfer.getData("text/plain"),t=X.st[id];
  if(t&&t.status!==col.dataset.drop)setSStatus(id,col.dataset.drop);
});

/* ───────── forms ───────── */
const FORMS={
  async ptask(f){
    const fd=new FormData(f),id=f.dataset.id,old=id?S.tasks.find(t=>t.id===id):null;
    const subs=$$(".subrow",f).map(r=>({id:r.dataset.sid||rid(),title:$("input[type=text]",r).value.trim(),done:$("input[type=checkbox]",r).checked})).filter(s=>s.title);
    const title=String(fd.get("title")||"").trim();if(!title)return;
    const rec=Object.assign(old?strip(old):{status:"todo",doneAt:0,createdAt:Date.now()},{title:title,due:fd.get("due")||"",priority:fd.get("priority")||"moyenne",category:String(fd.get("category")||"").trim(),goalId:fd.get("goalId")||"",notes:String(fd.get("notes")||""),subtasks:subs,shared:fd.get("shared")==="on",updatedAt:Date.now()});
    const ref=id?C.tasks.doc(id):C.tasks.doc();
    if(await run(id?"Tâche enregistrée":"Tâche ajoutée",()=>ref.set(rec))){closeModal();recon()}
  },
  async mood(f){
    const id=f.dataset.id,m=S.mood.find(x=>x.id===id);if(!m)return;
    const cap=String(new FormData(f).get("caption")||"").trim();
    if(await run("Légende enregistrée",()=>C.mood.doc(id).update({caption:cap})))closeModal();
  },
  async quick(f){
    const inp=$("#quick-t"),v=inp.value.trim();if(!v)return;
    const u=S.ui.todo,due=u.mode==="jour"?u.anchor:(u.mode==="semaine"&&startOfWeek(u.anchor)<=todayStr()&&todayStr()<=addDays(startOfWeek(u.anchor),6)?todayStr():(u.mode==="semaine"?startOfWeek(u.anchor):todayStr()));
    inp.value="";S.ui.refocus="quick-t";
    await run("Tâche ajoutée",()=>C.tasks.doc().set({title:v,due:due,priority:"moyenne",category:"",goalId:"",notes:"",subtasks:[],shared:false,status:"todo",doneAt:0,createdAt:Date.now(),updatedAt:Date.now()}));
  },
  async goal(f){
    const fd=new FormData(f),id=f.dataset.id,old=id?S.goals.find(g=>g.id===id):null;
    const title=String(fd.get("title")||"").trim();if(!title)return;
    const rec=Object.assign(old?strip(old):{createdAt:Date.now()},{title:title,description:String(fd.get("description")||""),horizon:fd.get("horizon"),due:fd.get("due")||"",category:String(fd.get("category")||"").trim(),status:fd.get("status"),shared:fd.get("shared")==="on",updatedAt:Date.now()});
    const ref=id?C.goals.doc(id):C.goals.doc();
    if(await run(id?"Objectif enregistré":"Objectif créé",()=>ref.set(rec))){closeModal();recon()}
  },
  async project(f){
    const fd=new FormData(f),id=f.dataset.id,old=id?X.proj[id]:null;
    const title=String(fd.get("title")||"").trim();if(!title)return;
    const rec=Object.assign(old?strip(old):{createdBy:S.uid,createdAt:Date.now()},{title:title,description:String(fd.get("description")||""),kind:fd.get("kind"),due:fd.get("due")||"",updatedAt:Date.now()});
    const ref=id?C.projects.doc(id):C.projects.doc();
    if(await run(id?"Projet enregistré":"Projet créé",()=>ref.set(rec))){closeModal();if(!id){S.page="duo";S.ui.duo.pid=ref.id}render()}
  },
  async stask(f){
    const fd=new FormData(f),id=f.dataset.id,fr=friendId();
    const title=String(fd.get("title")||"").trim();if(!title)return;
    const who=fd.get("who");
    const assignees=who==="both"&&fr?[S.uid,fr]:(who==="her"&&fr?[fr]:[S.uid]);
    const rid2=await saveSTask(id||null,{title:title,projectId:fd.get("projectId"),status:fd.get("status"),priority:fd.get("priority"),due:fd.get("due")||"",assignees:assignees,notes:String(fd.get("notes")||"")});
    if(rid2){closeModal();recon()}
  },
  async resched(f){
    const fd=new FormData(f),date=fd.get("date")||"",k=f.dataset.k,id=f.dataset.id;
    if(k==="p"){if(await run("Tâche reportée",()=>C.tasks.doc(id).update({due:date,updatedAt:Date.now()}))){closeModal();recon()}}
    else{
      if(!date){await run("Retirée de ta journée",()=>C.plan.doc(id).delete());closeModal();return}
      if(await run("Tâche reportée",()=>C.plan.doc(id).set({taskId:id,date:date,addedAt:Date.now()})))closeModal();
    }
  },
  async plan(f){
    const fd=new FormData(f),date=fd.get("date");if(!date)return;
    const id=f.dataset.id,had=!!X.plan[id];
    if(await run(had?"Tâche déplacée":"Ajoutée à ta journée du "+shortDate(date),()=>C.plan.doc(id).set({taskId:id,date:date,addedAt:Date.now()})))closeModal();
  }
};
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;
  e.preventDefault();
  const b=$("button[type=submit]",f);if(b)b.disabled=true;
  Promise.resolve(FORMS[f.dataset.form](f)).finally(()=>{if(b&&b.isConnected)b.disabled=false});
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.booted)scheduleRender()});

/* ───────── boot ───────── */
function mark(k){S.ready[k]=true;if(!S.booted&&ALL.every(x=>S.ready[x])){S.booted=true;S.enter=true;recon()}scheduleRender()}
const mapDocs=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
let lastMembers="";
async function refreshProfiles(){
  const ids=Array.from(new Set([S.uid].concat((S.duo&&S.duo.members)||[])));
  try{S.profiles=await S.user.profiles(ids)}catch(e){}
  scheduleRender();
}
function listen(key,q,fn){
  q.onSnapshot(s=>{fn(s);mark(key)},err=>{S.errors[key]=err;mark(key)});
}
async function boot(){
  applyTheme();
  try{const p=localStorage.getItem("dd-page");if(p&&NAV.some(n=>n.id===p))S.page=p}catch(e){}
  render();
  if(window.__claudeReady)await window.__claudeReady;
  const cl=window.claude;
  if(!cl||!cl.use){S.gate="nojs";render();return}
  let db=null,user=null;
  try{db=await cl.use("db");user=await cl.use("user")}catch(e){}
  if(!db||!user){S.gate="signedout";render();return}
  S.db=db;S.user=user;
  S.uid=await user.id();
  if(!S.uid){S.gate="noid";render();return}
  S.me=await user.me();
  try{S.canWrite=await user.can("data.write")}catch(e){S.canWrite=null}
  const base=db.doc("data/users/"+S.uid+"/space");
  C={tasks:base.collection("tasks"),goals:base.collection("goals"),plan:base.collection("plan"),mood:base.collection("mood"),prefs:db.doc("data/users/"+S.uid+"/prefs"),
     projects:db.collection("projects"),stasks:db.collection("stasks"),comments:db.collection("scomments"),mirrors:db.collection("mirrors"),pstats:db.collection("pstats"),duo:db.doc("duo/state")};
  listen("duo",C.duo,s=>{S.duo=s.exists?s.data():null;const k=((S.duo&&S.duo.members)||[]).join(",");if(k!==lastMembers){lastMembers=k;refreshProfiles()}});
  listen("projects",C.projects,s=>{S.projects=mapDocs(s)});
  listen("stasks",C.stasks,s=>{S.stasks=mapDocs(s)});
  listen("comments",C.comments,s=>{S.comments=mapDocs(s)});
  listen("mirrors",C.mirrors,s=>{S.mirrors=mapDocs(s)});
  listen("pstats",C.pstats,s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.pstats=o});
  listen("tasks",C.tasks,s=>{S.tasks=mapDocs(s)});
  listen("goals",C.goals,s=>{S.goals=mapDocs(s)});
  listen("plan",C.plan,s=>{S.plan=mapDocs(s)});
  listen("mood",C.mood,s=>{S.mood=mapDocs(s)});
  listen("prefs",C.prefs,s=>{S.prefs=s.exists?s.data():{}});
  refreshProfiles();
}
boot();
})();
</script>
